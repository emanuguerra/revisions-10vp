slug: geo-climat
subject: geographie
title: Météo, climat et changement climatique
subtitle: "Révision pour l'épreuve du vendredi 20 novembre 2026 : météo et climat, diagrammes climatiques, effet de serre, cycle du carbone, conséquences et adaptation, régions polaires et régions chaudes."
order: 1
ui_lang: fr

# Suggested during focus breaks: `search` opens a YouTube search; `url` (a YouTube link) plays in the page
break_videos:
  - { title: "L'effet de serre expliqué simplement", search: "effet de serre expliqué simplement" }
  - { title: "Lire un diagramme climatique", search: "lire un diagramme climatique" }
  - { title: "La fonte de la banquise et des glaciers", search: "fonte banquise inlandsis explication" }

# Topics of the questions (the "category" field of the items), used by the training filter
categories:
  meteo: Météo et climat
  climats: Les climats
  causes: Causes de l'évolution du climat
  serre: Atmosphère et effet de serre
  carbone: Cycle du carbone
  consequences: Conséquences et vulnérabilité
  adaptation: Adaptation
  glace: Banquise, inlandsis, pergélisol
  polaire: Régions polaires
  chaud: Régions chaudes

lessons:
  - slug: climat
    title: "1. Météo et climats"
    blocks:
      - type: html
        file: lecon-1-climats.html
  - slug: effet-de-serre
    title: "2. Effet de serre et carbone"
    blocks:
      - type: html
        file: lecon-2-effet-de-serre.html
  - slug: consequences
    title: "3. Conséquences et adaptation"
    blocks:
      - type: html
        file: lecon-3-consequences.html

exercises_title: "4. Exercices"
exercises:
  - key: cours
    title: Questions de cours
    generator: common.mcq
    params: { kind: qcm }
  - key: tri
    title: Classe dans la bonne case
    generator: common.mcq
    params: { kind: tri }
  - key: diagramme
    title: Lire un diagramme climatique
    generator: climat.read_diagram
  - key: type
    title: Quel climat ?
    generator: climat.classify
  - key: vf
    title: Vrai ou faux ?
    generator: common.true_false
    params: { kind: vf }
  - key: albedo
    title: Calculer avec l'albédo
    generator: climat.albedo
  - key: documents
    title: Analyser un document
    generator: common.mcq
    params: { kind: doc }
  - key: ecrit
    title: Explique avec tes mots
    generator: common.written
    params: { kind: essai }

  # --- Test de préparation au TS (exam_only: asked only in the test, one per objective) ---
  - key: ts01
    title: "Obj. 1 · Météo et climat"
    generator: common.exam_item
    params: { kinds: [qcm, tri], categories: [meteo], lesson: climat, exam_only: true }
  - key: ts02
    title: "Obj. 2 · Causes de l'évolution du climat"
    generator: common.exam_item
    params: { kinds: [qcm, tri], categories: [causes], lesson: effet-de-serre, exam_only: true }
  - key: ts03
    title: "Obj. 3 · Décrire et comparer les climats"
    generator: climat.classify
    params: { lesson: climat, exam_only: true }
  - key: ts04
    title: "Obj. 4 · Lire un diagramme climatique"
    generator: climat.read_diagram
    params: { lesson: climat, exam_only: true }
  - key: ts05
    title: "Obj. 5 · Atmosphère et effet de serre"
    generator: common.exam_item
    params: { kinds: [qcm], categories: [serre], lesson: effet-de-serre, exam_only: true }
  - key: ts06
    title: "Obj. 6 · Gaz à effet de serre (sources)"
    generator: common.exam_item
    params: { kinds: [tri], categories: [serre], lesson: effet-de-serre, exam_only: true }
  - key: ts07
    title: "Obj. 7 · Activités humaines et cycle du carbone"
    generator: common.exam_item
    params: { kinds: [qcm, tri], categories: [carbone], lesson: effet-de-serre, exam_only: true }
  - key: ts08
    title: "Obj. 8 · Analyse critique de documents"
    generator: common.exam_item
    params: { kinds: [doc], lesson: effet-de-serre, exam_only: true }
  - key: ts09
    title: "Obj. 9 · Modèle climatique et albédo"
    generator: climat.albedo
    params: { lesson: effet-de-serre, exam_only: true }
  - key: ts10
    title: "Obj. 10 · Conséquences et vulnérabilité"
    generator: common.exam_item
    params: { kinds: [qcm, doc], categories: [consequences], lesson: consequences, exam_only: true }
  - key: ts11
    title: "Obj. 11 · Mesures d'adaptation"
    generator: common.exam_item
    params: { kinds: [qcm, tri], categories: [adaptation], lesson: consequences, exam_only: true }
  - key: ts12
    title: "Obj. 12 · Banquise, inlandsis, pergélisol"
    generator: common.exam_item
    params: { kinds: [qcm, tri], categories: [glace], lesson: consequences, exam_only: true }
  - key: ts13
    title: "Obj. 13 · Régions polaires et routes maritimes"
    generator: common.exam_item
    params: { kinds: [qcm, doc], categories: [polaire], lesson: consequences, exam_only: true }
  - key: ts14
    title: "Obj. 14 · Régions chaudes : sécheresse et crises alimentaires"
    generator: common.exam_item
    params: { kinds: [qcm, doc], categories: [chaud], lesson: consequences, exam_only: true }
  - key: tsw
    title: "Expliquer : question à rédiger"
    generator: common.written
    params: { kind: essai, lesson: effet-de-serre, exam_only: true }

mission:
  mode: sequence
  sequence: [cours, diagramme, tri, vf, type, albedo, cours, documents, diagramme, tri, vf, cours]
  title: "🎯 Mission : 12 questions"
  description: "Un peu de tout, comme à l'épreuve. +10 points au premier essai, +5 si tu corriges ta réponse. +5 de bonus dès 3 réponses justes de suite du premier coup 🔥. Un indice coûte 3 points."
  badges:
    - Encore un effort ! Relis les leçons et réessaie.
    - Apprenti·e climatologue
    - Expert·e du climat
    - Climatologue en chef·fe

# Test de préparation au TS: one attempt, no hint, grade and result by objective
exam:
  title: "📝 Test de préparation au TS"
  description: "20 questions sur les 14 objectifs, dans les conditions du test : un seul essai, pas d'indice. À la fin : une note estimée et, pour chaque objectif, ce qu'il faut encore réviser."
  sequence: [ts01, ts04, ts03, ts02, ts05, ts06, ts07, ts08, ts09, ts10, ts11, ts12, ts13, ts14, tsw, ts01, ts04, ts07, ts12, tsw]

training: true

scoring:
  first: 10
  retry: 5
  hint_cost: 3
  streak_bonus: 5
  streak_from: 3
