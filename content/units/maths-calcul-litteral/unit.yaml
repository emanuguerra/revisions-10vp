slug: maths-calcul-litteral
subject: maths
title: Calcul littéral
subtitle: "Révision 10e VP : réduire, développer, factoriser et calculer la valeur d'une expression, puis des exercices pour gagner des étoiles."
order: 2
ui_lang: fr

levels:
  - label: Facile
    info: Une seule lettre, nombres positifs, distributivité simple.
  - label: Moyen
    info: Nombres négatifs, x², signe − devant une parenthèse, double distributivité.
  - label: Expert
    info: Deux lettres, plusieurs parenthèses, identités remarquables.

# Suggested during focus breaks: `search` opens a YouTube search; `url` (a YouTube link) plays in the page
break_videos:
  - { title: "Développer et factoriser", search: "calcul littéral développer factoriser explication" }
  - { title: "La double distributivité en vidéo", search: "double distributivité explication" }

lessons:
  - slug: theorie
    title: "1. Réviser"
    blocks:
      - type: html
        file: theorie.html

exercises_title: "2. Exercices"
exercises:
  - key: valeur
    title: Valeur d'une expression
    generator: litteral.evaluate
  - key: traduire
    title: Traduire en expression
    generator: litteral.translate
  - key: reduire
    title: Réduire
    generator: litteral.reduce
  - key: developper
    title: Développer
    generator: litteral.distribute
  - key: double
    title: Double distributivité
    generator: litteral.double_distribute
  - key: factoriser
    title: Factoriser
    generator: litteral.factor
  - key: vf
    title: Vrai ou faux ?
    generator: common.true_false
    params: { kind: vf }
  - key: erreur
    title: Trouve l'erreur
    generator: common.find_mistake
    params: { kind: error }
  # --- Test de préparation au TS (exam_only: asked only in the test), modelled on the class test ---
  - key: ts1
    title: "Ex. 1 · Réduire"
    generator: litteral.ts_reduce
    params: { lesson: theorie, exam_only: true }
  - key: ts2
    title: "Ex. 2 · Traduire en expression"
    generator: litteral.ts_translate
    params: { lesson: theorie, exam_only: true }
  - key: ts3
    title: "Ex. 3 · Remplacer et calculer"
    generator: litteral.ts_substitute
    params: { lesson: theorie, exam_only: true }
  - key: ts4
    title: "Ex. 4 · Périmètre et aire de figures"
    generator: litteral.ts_figures
    params: { lesson: theorie, exam_only: true }
  - key: ts5
    title: "Ex. 5 · Longueur d'un segment"
    generator: litteral.ts_segments
    params: { lesson: theorie, exam_only: true }
  - key: ts6
    title: "Ex. 6 · Expressions équivalentes ?"
    generator: litteral.ts_equivalent
    params: { lesson: theorie, exam_only: true }
  - key: ts7
    title: "Ex. 7 · Figure en fonction de a et b"
    generator: litteral.ts_grid
    params: { lesson: theorie, exam_only: true }
  - key: ts8
    title: "Ex. 8 · Deux carrés accolés"
    generator: litteral.ts_squares
    params: { lesson: theorie, exam_only: true }

mission:
  mode: sequence
  sequence: [valeur, reduire, traduire, developper, vf, double, factoriser, erreur, reduire, developper]
  title: "🎯 Mission : 10 questions"
  description: "Un peu de tout. +10 points au premier essai, +5 si tu corriges ta réponse (3 essais au maximum). +5 de bonus dès 3 réponses justes de suite du premier coup 🔥. Un indice coûte 3 points. Une réponse juste mais pas réduite ne compte pas comme un essai."
  badges:
    - Encore un effort ! Relis la théorie et réessaie.
    - Apprenti·e du calcul littéral
    - As de la distributivité
    - Maître·sse des expressions

# Test de préparation au TS: same 8 exercises as the class test, new numbers each time
exam:
  title: "📝 Test de préparation au TS"
  description: "20 questions comme au TS (réduire, traduire, remplacer, figures, segments, expressions équivalentes, quadrillage, carrés accolés), dans les conditions du test : un seul essai, pas d'indice. À la fin : une note estimée et ce qu'il faut encore réviser."
  sequence: [ts1, ts1, ts1, ts1, ts1, ts2, ts2, ts3, ts3, ts3, ts4, ts4, ts5, ts5, ts6, ts6, ts7, ts7, ts8, ts8]

training: true

scoring:
  first: 10
  retry: 5
  hint_cost: 3
  streak_bonus: 5
  streak_from: 3
