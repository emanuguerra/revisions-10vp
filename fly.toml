# Fly.io configuration: one machine, SQLite on a persistent volume mounted at /data.
# First deploy:  fly volumes create data --region cdg --size 1
#                fly secrets set ACCESS_CODE=...      (the code the students type once)
#                fly deploy --ha=false
# See README.md, "Put it online (Fly.io)".

app = 'revisions-10vp'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  CORS_ORIGINS = 'https://revisions-10vp.fly.dev'

# The database lives here: it survives restarts and new deployments
[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8010
  force_https = true
  # The machine sleeps when nobody uses the app (cheaper) and wakes up in a few seconds
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpus = 1
